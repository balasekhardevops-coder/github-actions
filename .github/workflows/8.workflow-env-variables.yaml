name: Workflow with Environment Variables

env:
  APP_ENV: production

on: workflow_dispatch

jobs:
  build:
    env:
     APP_ENV: development
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        env:
         APP_ENV: stage
        uses: actions/checkout@v4

      - name: Print Environment Variable
        run: echo "The application environment is $APP_ENV"
