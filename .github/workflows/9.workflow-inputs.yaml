name: Workflow of Inputs

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Choose environment to deploy'
        type: choice
        required: true
        default: 'staging'
        options:
          - staging
          - production
          - development
      artifactTag:
        description: 'Enter the artifact tag to deploy'
        required: true
        default: 'v1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: "Deploy the application"
        run: echo "Deploy ${{ inputs.artifactTag }} to ${{ inputs.environment }} environment"
